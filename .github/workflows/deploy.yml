# Publie l'app sur GitHub Pages à chaque envoi sur la branche main.
name: Déploiement GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # L'app est servie sous https://<pseudo>.github.io/<nom-du-dépôt>/
      - run: npm run build -- --base=/${{ github.event.repository.name }}/
      # GitHub Pages renvoie 404.html pour les adresses inconnues : on y met l'app pour que
      # le rechargement d'une page (ex. /fiches) fonctionne.
      - run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
